name: native-contract-verify
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verification:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'
      - name: Check selected Swift toolchain
        run: |
          xcode-select -p
          test "$(xcodebuild -version | sed -n '1s/.* //p')" = "16.2"
          swift --version
          xcodebuild -version
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.8'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17.0.13+11'
      - name: Verify schema, builds, unit tests and differential traces
        id: verify
        run: bash scripts/verify.sh "$RUNNER_TEMP/native-contract-artifacts"
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/native-contract-gradle-cache
          CLANG_MODULE_CACHE_PATH: ${{ runner.temp }}/native-contract-swift-cache/clang
          SWIFTPM_MODULECACHE_OVERRIDE: ${{ runner.temp }}/native-contract-swift-cache/modules
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-contract-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/native-contract-artifacts
          if-no-files-found: warn
          retention-days: 90
