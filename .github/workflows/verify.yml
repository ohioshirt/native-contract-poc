name: native-contract-verify
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verification:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '16.2'
      - name: Check selected Swift toolchain
        run: |
          xcode-select -p
          test "$(xcodebuild -version | sed -n '1s/.* //p')" = "16.2"
          swift --version
          xcodebuild -version
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.8'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17.0.13+11'
      - name: Verify formal model, schema, builds, unit tests and differential traces
        id: verify
        run: bash scripts/verify.sh "$RUNNER_TEMP/native-contract-artifacts"
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/native-contract-gradle-cache
          CLANG_MODULE_CACHE_PATH: ${{ runner.temp }}/native-contract-swift-cache/clang
          SWIFTPM_MODULECACHE_OVERRIDE: ${{ runner.temp }}/native-contract-swift-cache/modules
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-contract-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/native-contract-artifacts
          if-no-files-found: warn
          retention-days: 90
